# HOPS gitleaks config (used by scripts/security-check.sh).
title = "HOPS"

[extend]
useDefault = true

[[allowlists]]
description = "Paths that are never scanned"
paths = [
  '''(^|/)tests/prerelease/hopsexport/''',  # Jonathan's real exports: never scanned or printed
  '''(^|/)design/feedback/''',               # raw user feedback
  '''(^|/)node_modules/''',
  '''(^|/)data/''',                          # runtime data dirs
  '''(^|/)\.git/''',
  '''(^|/)(dist|build|\.svelte-kit)/''',
  '''package-lock\.json$''',
]

# Known false positives. Each entry: one placeholder, with the reason.
[[allowlists]]
description = "GETTING_STARTED.md curl example: 'Authorization: Bearer YOUR_SESSION_TOKEN' is a documentation placeholder, not a credential"
commits = ["2c1da05338d637096db0945801d73e69a17a4dcf"]
paths = ['''GETTING_STARTED\.md$''']
