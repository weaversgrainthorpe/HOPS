# HOPS gitleaks config (used by scripts/security-check.sh).
title = "HOPS"

[extend]
useDefault = true

[[allowlists]]
description = "Paths that are never scanned"
paths = [
  '''(^|/)tests/prerelease/hopsexport/''',  # local private folder (never committed): never scanned or printed
  '''(^|/)design/feedback/''',               # local private folder (never committed)
  '''(^|/)node_modules/''',
  '''(^|/)data/''',                          # runtime data dirs
  '''(^|/)\.git/''',
  '''(^|/)(dist|build|\.svelte-kit)/''',
  '''package-lock\.json$''',
  '''(^|/)\.superpowers/''',                # gitignored local scratch (brainstorm server logs hold its throwaway access key)
]

# Known false positives. Each entry: one placeholder, with the reason.
[[allowlists]]
description = "GETTING_STARTED.md curl example: 'Authorization: Bearer YOUR_SESSION_TOKEN' is a documentation placeholder, not a credential"
commits = ["2c1da05338d637096db0945801d73e69a17a4dcf"]
paths = ['''GETTING_STARTED\.md$''']

[[allowlists]]
description = "auth.go tempPasswordAlphabet: the characters a reset's temporary password is drawn from (the password itself is random per reset and never stored in plain), not a credential"
regexTarget = "line"
regexes = ['''tempPasswordAlphabet\s*=''']
paths = ['''backend/internal/auth/auth\.go$''']
