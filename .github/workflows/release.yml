name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      label: ${{ steps.meta.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse and check the tag
        id: meta
        # vX.Y.Z is a normal release; vX.Y.Z-<label> (e.g. v3.0.0-rc1) is a
        # pre-release. X.Y.Z must equal the VERSION file, and the label must
        # be the form scripts/build-rc.sh accepts. Anything else fails here,
        # before anything is built or published.
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([A-Za-z0-9][A-Za-z0-9.]*))?$ ]]; then
            echo "::error::tag '$tag' is not vX.Y.Z or vX.Y.Z-<label> (label: letters, digits, dots)"
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          label="${BASH_REMATCH[3]}"
          file_version=$(tr -d '[:space:]' < VERSION)
          if [[ "$base" != "$file_version" ]]; then
            echo "::error::tag '$tag' is for $base but VERSION says $file_version"
            exit 1
          fi
          if [[ -n "$label" ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "version=${tag#v}"
            echo "label=$label"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version=${tag#v} label='${label}' prerelease=$prerelease"

  test:
    name: Test (gate for every build and publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION / version.go / package.json / docs agree
        run: ./scripts/check-versions.sh

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Backend vet
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Backend tests
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npx vitest run

      - name: Frontend type check
        working-directory: frontend
        run: npm run check

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  build-frontend:
    name: Build Frontend
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Archive frontend build
        run: tar -czf hops-frontend.tar.gz -C frontend/build .

      - uses: actions/upload-artifact@v4
        with:
          name: hops-frontend
          path: hops-frontend.tar.gz

  build:
    name: Build ${{ matrix.os }}-${{ matrix.name || matrix.arch }}
    runs-on: ubuntu-latest
    # The UI is embedded into the binary via //go:embed, so the frontend build
    # must exist before `go build`. Reuse the single build-frontend artifact
    # across the matrix rather than rebuilding the SPA five times.
    needs: [meta, test, build-frontend]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''
          - os: windows
            arch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: hops-frontend

      - name: Stage frontend for embedding
        run: |
          mkdir -p backend/internal/web/build
          tar -xzf hops-frontend.tar.gz -C backend/internal/web/build

      - name: Build backend
        working-directory: backend
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          # Same stamp as scripts/build-rc.sh: a pre-release binary reports
          # e.g. 3.0.0-rc1 on /api/health and in About. Empty for vX.Y.Z.
          PRERELEASE: ${{ needs.meta.outputs.label }}
        run: go build -trimpath -ldflags="-s -w -X github.com/weaversgrainthorpe/HOPS/internal/version.Prerelease=${PRERELEASE}" -o ../hops-${{ matrix.os }}-${{ matrix.name || matrix.arch }}${{ matrix.ext }} ./cmd/hops

      - uses: actions/upload-artifact@v4
        with:
          name: hops-${{ matrix.os }}-${{ matrix.name || matrix.arch }}
          path: hops-${{ matrix.os }}-${{ matrix.name || matrix.arch }}${{ matrix.ext }}

  docker-publish:
    name: Publish Docker image to GHCR
    needs: [meta, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out image tags
        id: version
        # A pre-release (vX.Y.Z-<label>) pushes only its own version tags;
        # only a plain vX.Y.Z moves :latest.
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/hops
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:v$VERSION"
            if [[ "$PRERELEASE" != "true" ]]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Home Operations Portal System
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  release:
    name: Create Release
    needs: [meta, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets
        run: |
          mkdir -p packages

          # The UI is embedded in each binary, so every platform binary is a
          # complete, single-file download. Attach them directly (no folder,
          # no archive to unpack) and publish a checksums file alongside.
          for binary in artifacts/hops-*; do
            # Skip the intermediate frontend tarball if present.
            [[ "$binary" == *"frontend"* ]] && continue
            filename=$(basename "$binary")
            cp "$binary" "packages/${filename}"
            [[ "$filename" != *.exe ]] && chmod +x "packages/${filename}"
          done

          # Docker users still get the compose file.
          cp docker-compose.yml packages/

          # The Linux installer (packaging/install.sh) downloads
          # hops-linux-<arch> + SHA256SUMS from releases/latest/download.
          cp packaging/install.sh packages/install.sh
          # The Proxmox VE helper (creates a CT and runs install.sh in it).
          cp packaging/proxmox/hops-proxmox.sh packages/hops-proxmox.sh

          # Checksums for integrity verification. install.sh reads this
          # exact name (SHA256SUMS, sha256sum format, bare filenames).
          (cd packages && sha256sum hops-* install.sh > SHA256SUMS)  # hops-* includes hops-proxmox.sh

          ls -la packages/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # vX.Y.Z-<label> is a GitHub pre-release and never "latest", so
          # install.sh's releases/latest/download keeps serving the last
          # normal release.
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: packages/*
