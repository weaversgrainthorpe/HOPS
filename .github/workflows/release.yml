name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''
          - os: windows
            arch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w" -o ../hops-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/hops

      - uses: actions/upload-artifact@v4
        with:
          name: hops-${{ matrix.os }}-${{ matrix.arch }}
          path: hops-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Archive frontend build
        run: tar -czf hops-frontend.tar.gz -C frontend/build .

      - uses: actions/upload-artifact@v4
        with:
          name: hops-frontend
          path: hops-frontend.tar.gz

  docker-publish:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hops:latest
            ghcr.io/${{ github.repository_owner }}/hops:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hops:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Home Operations Portal System
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  release:
    name: Create Release
    needs: [build, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Bundle platform packages
        run: |
          mkdir -p packages

          # Extract frontend build into a reusable directory
          mkdir -p frontend-build
          tar -xzf artifacts/hops-frontend.tar.gz -C frontend-build

          # Bundle each platform binary with the frontend
          for binary in artifacts/hops-*; do
            # Skip the frontend tarball
            [[ "$binary" == *"frontend"* ]] && continue

            filename=$(basename "$binary")

            # Parse platform info from filename (e.g., hops-linux-amd64, hops-windows-amd64.exe)
            name_no_ext="${filename%.exe}"
            platform="${name_no_ext#hops-}"  # e.g., linux-amd64, darwin-arm64

            # Create staging directory
            staging="staging-${platform}"
            mkdir -p "${staging}/frontend/build"

            # Copy binary and frontend
            cp "$binary" "${staging}/"
            cp -r frontend-build/* "${staging}/frontend/build/"

            # Make binary executable
            chmod +x "${staging}/${filename}"

            # Create tarball
            if [[ "$filename" == *".exe" ]]; then
              # Windows: create zip
              (cd "${staging}" && zip -r "../packages/hops-${platform}.zip" .)
            else
              # Linux/macOS: create tar.gz
              tar -czf "packages/hops-${platform}.tar.gz" -C "${staging}" .
            fi

            rm -rf "${staging}"
          done

          # Also include Docker compose file
          cp docker-compose.yml packages/

          ls -la packages/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/*
