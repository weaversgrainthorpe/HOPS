name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Archive frontend build
        run: tar -czf hops-frontend.tar.gz -C frontend/build .

      - uses: actions/upload-artifact@v4
        with:
          name: hops-frontend
          path: hops-frontend.tar.gz

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    # The UI is embedded into the binary via //go:embed, so the frontend build
    # must exist before `go build`. Reuse the single build-frontend artifact
    # across the matrix rather than rebuilding the SPA five times.
    needs: build-frontend
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''
          - os: windows
            arch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: hops-frontend

      - name: Stage frontend for embedding
        run: |
          mkdir -p backend/internal/web/build
          tar -xzf hops-frontend.tar.gz -C backend/internal/web/build

      - name: Build backend
        working-directory: backend
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w" -o ../hops-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/hops

      - uses: actions/upload-artifact@v4
        with:
          name: hops-${{ matrix.os }}-${{ matrix.arch }}
          path: hops-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  docker-publish:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hops:latest
            ghcr.io/${{ github.repository_owner }}/hops:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hops:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Home Operations Portal System
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets
        run: |
          mkdir -p packages

          # The UI is embedded in each binary, so every platform binary is a
          # complete, single-file download. Attach them directly (no folder,
          # no archive to unpack) and publish a checksums file alongside.
          for binary in artifacts/hops-*; do
            # Skip the intermediate frontend tarball if present.
            [[ "$binary" == *"frontend"* ]] && continue
            filename=$(basename "$binary")
            cp "$binary" "packages/${filename}"
            [[ "$filename" != *.exe ]] && chmod +x "packages/${filename}"
          done

          # Docker users still get the compose file.
          cp docker-compose.yml packages/

          # Checksums for integrity verification of the bare binaries.
          (cd packages && sha256sum hops-* > SHA256SUMS.txt)

          ls -la packages/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/*
