# A homelab-style Homer config written for HOPS's import tests: the icon and
# logo forms Homer users actually have (Font Awesome 5/6 names, dashboard-icons
# URLs, relative asset paths), tags, targets, and a group with no name.
title: "Homelab"
subtitle: "Home"
logo: "assets/logo.png"
services:
  - name: "Media"
    icon: "fas fa-film"
    items:
      - name: "Jellyfin"
        logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/jellyfin.png"
        subtitle: "Films and TV"
        tag: "media"
        url: "http://jellyfin.example.lan:8096"
        target: "_blank"
      - name: "Sonarr"
        logo: "assets/tools/sonarr.png"
        subtitle: "TV"
        url: "http://sonarr.example.lan:8989"
      - name: "Radarr"
        icon: "fas fa-film"
        url: "http://radarr.example.lan:7878"
  - name: "Infrastructure"
    icon: "fas fa-server"
    items:
      - name: "Proxmox"
        logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/proxmox.svg"
        subtitle: "Hypervisor"
        url: "https://pve.example.lan:8006"
      - name: "Pi-hole"
        icon: "fa-solid fa-shield-halved"
        url: "http://pihole.example.lan/admin"
      - name: "Router"
        icon: "fas fa-network-wired"
        url: "http://192.168.1.1"
      - name: "Grafana"
        icon: "fab fa-grafana"
        url: "http://grafana.example.lan:3000"
        type: "Ping"
  - items:
      - name: "No-group item"
        icon: "fas fa-question"
        url: "http://misc.example.lan"
