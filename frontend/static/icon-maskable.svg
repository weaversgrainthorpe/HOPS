<!-- Maskable PWA icon — the actual artwork is constrained to the central
     ~80% so platforms that crop to a circle/squircle don't clip the bunny.
     The blue gradient fills the full canvas to look intentional under
     whatever shape the OS applies. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background so cropping is unnoticeable -->
  <rect width="32" height="32" fill="url(#bgGrad)"/>

  <!-- The original artwork, scaled down into the central safe zone (~70%)
       and re-centred. Original is 32x32 with content roughly centred at
       (16, 16); scale 0.7 + translate keeps it inside the safe-zone disc. -->
  <g transform="translate(16, 16) scale(0.7) translate(-16, -16)">
    <!-- Simplified bunny -->
    <g transform="translate(16, 17)">
      <ellipse cx="0" cy="0" rx="5" ry="6" fill="#f8f9fa"/>
      <circle cx="0" cy="-4.5" r="4" fill="#f8f9fa"/>
      <ellipse cx="-1.5" cy="-7.5" rx="1" ry="3.5" fill="#f8f9fa"/>
      <ellipse cx="1.5" cy="-7.5" rx="1" ry="3.5" fill="#f8f9fa"/>
      <ellipse cx="-1.5" cy="-7" rx="0.5" ry="2" fill="#fecdd3"/>
      <ellipse cx="1.5" cy="-7" rx="0.5" ry="2" fill="#fecdd3"/>
      <circle cx="-1.5" cy="-5" r="0.5" fill="#1e293b"/>
      <circle cx="1.5" cy="-5" r="0.5" fill="#1e293b"/>
      <ellipse cx="0" cy="-3.5" rx="0.6" ry="0.4" fill="#fca5a5"/>
      <circle cx="-4" cy="1.5" r="1.5" fill="#f8f9fa"/>
    </g>
    <!-- v3: three hop cones on a vine, kept inside the safe zone -->
    <g>
      <path d="M19.5 5 Q24 6.2 29.5 5" stroke="#a7f3d0" stroke-width="0.7" stroke-linecap="round"/>
      <ellipse cx="21.2" cy="8.6" rx="1.6" ry="2.4" fill="#10b981" stroke="#064e3b" stroke-width="0.4" transform="rotate(-6 21.2 8.6)"/>
      <ellipse cx="24.8" cy="9.4" rx="1.7" ry="2.6" fill="#34d399" stroke="#064e3b" stroke-width="0.4" transform="rotate(3 24.8 9.4)"/>
      <ellipse cx="28.4" cy="8.4" rx="1.6" ry="2.3" fill="#10b981" stroke="#064e3b" stroke-width="0.4" transform="rotate(8 28.4 8.4)"/>
    </g>
  </g>
</svg>
