<!-- App icon: the logo.svg artwork on a blue rounded square. PNGs come from scripts/generate-favicons.js. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bunnyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="url(#bgGrad)"/>

  <!-- Artwork from logo.svg (bunny + three hop cones, no tile row), on the blue square -->
  <g transform="translate(100 100) scale(1.0) translate(-100 -100)">
    <!-- Bunny -->
    <g transform="translate(96, 116)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="28" ry="32" fill="url(#bunnyGradient)"/>

    <!-- Head -->
    <circle cx="0" cy="-25" r="22" fill="url(#bunnyGradient)"/>

    <!-- Ears (long floppy) -->
    <ellipse cx="-10" cy="-42" rx="5" ry="18" fill="url(#bunnyGradient)" transform="rotate(-15 -10 -42)">
    </ellipse>
    <ellipse cx="10" cy="-42" rx="5" ry="18" fill="url(#bunnyGradient)" transform="rotate(15 10 -42)">
    </ellipse>

    <!-- Inner ears (pink) -->
    <ellipse cx="-10" cy="-40" rx="3" ry="12" fill="#fecdd3" transform="rotate(-15 -10 -40)"/>
    <ellipse cx="10" cy="-40" rx="3" ry="12" fill="#fecdd3" transform="rotate(15 10 -40)"/>

    <!-- Eyes (cute!) -->
    <circle cx="-8" cy="-28" r="2.5" fill="#1e293b"/>
    <circle cx="8" cy="-28" r="2.5" fill="#1e293b"/>
    <circle cx="-7" cy="-29" r="1" fill="#fff"/>
    <circle cx="9" cy="-29" r="1" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="0" cy="-20" rx="3" ry="2" fill="#fca5a5"/>

    <!-- Whiskers -->
    <line x1="-15" y1="-22" x2="-22" y2="-23" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="-15" y1="-20" x2="-22" y2="-20" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="15" y1="-22" x2="22" y2="-23" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="15" y1="-20" x2="22" y2="-20" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>

    <!-- Tail (fluffy!) -->
    <circle cx="-22" cy="8" r="8" fill="url(#bunnyGradient)"/>

    <!-- Back leg -->
    <ellipse cx="-18" cy="25" rx="8" ry="12" fill="url(#bunnyGradient)" transform="rotate(-20 -18 25)"/>

    <!-- Front paw -->
    <ellipse cx="12" cy="20" rx="6" ry="10" fill="url(#bunnyGradient)" transform="rotate(10 12 20)"/>

    <!-- Hopping motion animation -->
  </g>

    <!-- Three hop cones on a vine, pulled in from the corner -->
    <g transform="translate(-16 14)">
    <g>
    <path d="M140 14 Q160 22 182 16" stroke="#047857" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M168 20 q6 -8 12 -4" stroke="#10b981" stroke-width="1.6" fill="#34d399" stroke-linecap="round"/>
    <g transform="translate(150 34) rotate(-8) scale(0.95)">
      <ellipse cx="0" cy="0" rx="7" ry="10.5" fill="#10b981"/>
      <path d="M-6 -4 Q0 -1 6 -4 M-6.6 1 Q0 4 6.6 1 M-5.4 6 Q0 9 5.4 6" stroke="#047857" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M-4 -8 Q0 -6 4 -8" stroke="#34d399" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-10.5" x2="0" y2="-14" stroke="#047857" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g transform="translate(166 40) rotate(4) scale(1.1)">
      <ellipse cx="0" cy="0" rx="7" ry="10.5" fill="#10b981"/>
      <path d="M-6 -4 Q0 -1 6 -4 M-6.6 1 Q0 4 6.6 1 M-5.4 6 Q0 9 5.4 6" stroke="#047857" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M-4 -8 Q0 -6 4 -8" stroke="#34d399" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-10.5" x2="0" y2="-14" stroke="#047857" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g transform="translate(181 32) rotate(14) scale(0.85)">
      <ellipse cx="0" cy="0" rx="7" ry="10.5" fill="#10b981"/>
      <path d="M-6 -4 Q0 -1 6 -4 M-6.6 1 Q0 4 6.6 1 M-5.4 6 Q0 9 5.4 6" stroke="#047857" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M-4 -8 Q0 -6 4 -8" stroke="#34d399" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-10.5" x2="0" y2="-14" stroke="#047857" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>
    </g>
  </g>
</svg>
